name: qatu-hosted
services:
  api:
    build:
      context: ../..
      dockerfile: src/Qatu.Api/Dockerfile
    restart: unless-stopped
    environment:
      ConnectionStrings__Qatu: ${ConnectionStrings__Qatu}
      Supabase__Url: ${QATU_SUPABASE_URL}
      Supabase__PublicUrl: ${QATU_SUPABASE_URL}
      Supabase__PublishableKey: ${QATU_PUBLISHABLE_KEY}
      Supabase__ServiceRoleKey: ${QATU_SECRET_KEY}
      Bootstrap__AdminUserId: ${QATU_ADMIN_USER_ID:-}
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://127.0.0.1:8080/health >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s
  web:
    build:
      context: ../../web
    restart: unless-stopped
    ports:
      - "${QATU_WEB_PORT:-8080}:80"
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3
