name: qatu
services:
  auth:
    environment:
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOOGLE_ENABLED:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${API_EXTERNAL_URL}/callback
  realtime:
    profiles: [extras]
  functions:
    profiles: [extras]
  supavisor:
    profiles: [extras]
  api:
    build:
      context: ../..
      dockerfile: src/Qatu.Api/Dockerfile
    restart: unless-stopped
    environment:
      ConnectionStrings__Qatu: Host=db;Port=5432;Database=postgres;Username=postgres;Password=${POSTGRES_PASSWORD}
      Supabase__Url: http://api-gw:8000/
      Supabase__PublicUrl: http://localhost:8000
      Supabase__PublishableKey: ${ANON_KEY}
      Supabase__ServiceRoleKey: ${SERVICE_ROLE_KEY}
      Bootstrap__AdminUserId: ${QATU_ADMIN_USER_ID:-}
    depends_on:
      db: { condition: service_healthy }
      auth: { condition: service_healthy }
      api-gw: { condition: service_healthy }
      storage: { condition: service_healthy }
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://localhost:8080/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
  web:
    build:
      context: ../../web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 3
